[package]
name = "dive-desktop"
description = "Dive browser desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "dive_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
dive-core = { path = "../../../crates/dive-core" }
dive-cdp = { path = "../../../crates/dive-cdp" }
dive-mcp = { path = "../../../crates/dive-mcp" }
dive-agent = { path = "../../../crates/dive-agent" }
keyring-core = "1"
futures-util = "0.3"
async-trait = "0.1"
tauri = { workspace = true, features = ["unstable", "devtools", "specta"] }
tauri-specta = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
time = { workspace = true }
base64 = "0.22"
sourcemap = "9"
similar = "2"
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[features]
default = ["cef"]
# Chromium engine (the product). Requires cmake + ninja and the CEF CLI.
cef = ["tauri/cef"]
# System webview fallback for UI-only development without CEF.
wry = ["tauri/wry"]

[lints]
workspace = true
