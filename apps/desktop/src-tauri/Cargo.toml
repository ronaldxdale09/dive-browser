[package]
name = "dive-desktop"
description = "Dive browser desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "dive_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
dive-core = { path = "../../../crates/dive-core" }
dive-cdp = { path = "../../../crates/dive-cdp" }
dive-mcp = { path = "../../../crates/dive-mcp" }
dive-agent = { path = "../../../crates/dive-agent" }
keyring-core = "1"
futures-util = "0.3"
# Direct access to the same pinned native CEF types for safe discard.
cef = { version = "=151.8.1", optional = true }
# The pinned Tauri workspace disables runtime default features. Explicitly
# enable CEF's process sandbox; the packaged helper initializes it before CEF.
tauri-runtime-cef = { git = "https://github.com/tauri-apps/tauri", rev = "713203057982a38d810f64fe0930c9f7670b3a0d", default-features = false, features = ["sandbox"], optional = true }
async-trait = "0.1"
tauri = { workspace = true, features = ["unstable", "devtools", "specta", "protocol-asset"] }
tauri-specta = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
shlex = "2.0.1"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
tauri-plugin-updater = "2"
rfd = "0.16"
rusqlite = { workspace = true }
plist = "1"
anyhow = { workspace = true }
thiserror = { workspace = true }
tempfile = "3"
url = { workspace = true }
psl = "2"
time = { workspace = true }
base64 = "0.22"
sourcemap = "9"
similar = "2"
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gif = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
whisper-rs = { version = "0.14", optional = true }
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
core-foundation = "0.10"
whisper-rs = { version = "0.14", optional = true, features = ["metal"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }

[features]
default = ["cef", "whisper"]
# Local speech-to-text via whisper.cpp (builds with cmake). Turn off for a
# quick UI-only build that skips the native transcription toolchain.
whisper = ["dep:whisper-rs"]
# Chromium engine (the product). Requires cmake + ninja and the CEF CLI.
cef = ["tauri/cef", "dep:cef", "dep:tauri-runtime-cef"]
# System webview fallback for UI-only development without CEF.
wry = ["tauri/wry"]

[lints]
workspace = true
