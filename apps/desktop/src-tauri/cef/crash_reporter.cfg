# Chromium Embedded Framework crash reporting (crashpad).
# Placed next to the framework by scripts/release/prepare-bundle.sh. With no
# ServerURL the minidumps stay on the machine under the app's user data
# directory (Crashpad/), which is the opt-in default: nothing leaves the
# device unless a release sets ServerURL and the user has turned reporting on.
[Config]
ProductName=Dive
ProductVersion=0.1.21
AppName=Dive
ExternalHandler=false
MaxUploadsPerDay=5
MaxDatabaseSizeInMb=20
MaxDatabaseAgeInDays=5
