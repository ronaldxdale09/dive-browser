<!doctype html>
<title>Extension fixture</title>
<h1>Extension host page</h1>
<button id="camera">Use camera</button>
<button id="microphone">Use microphone</button>
<output id="media-result"></output>
<script>
  const result = document.getElementById("media-result");
  async function request(kind) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ [kind]: true });
      stream.getTracks().forEach((track) => track.stop());
      result.textContent = `${kind}: allowed`;
    } catch (error) {
      result.textContent = `${kind}: ${error.name}`;
    }
  }
  document.getElementById("camera").onclick = () => request("video");
  document.getElementById("microphone").onclick = () => request("audio");
</script>
