version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor:
        update-types: [minor, patch]
    ignore:
      # Pinned to the CEF distribution the vendored runtime is built against.
      - dependency-name: cef
      - dependency-name: cef-dll-sys
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      js-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@tauri-apps/cli-cef"
      # Moves with the tauri git revision in Cargo.toml, not on its own:
      # scripts/tests/test_tauri_versions.py fails if they disagree.
      - dependency-name: "@tauri-apps/api"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
