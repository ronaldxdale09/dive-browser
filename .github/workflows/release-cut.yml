name: release-cut

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Release kind (rc, patch, minor, major). Ignored if explicit version is given.'
        required: true
        type: choice
        options:
          - rc
          - patch
          - minor
          - major
        default: rc
      ref:
        description: 'Git ref to cut from (branch, tag, or SHA). Defaults to default branch.'
        required: false
        type: string
        default: main
      dry_run:
        description: 'Dry run: calculate and report next version without creating tags or releases'
        required: false
        type: boolean
        default: false
      version_suffix:
        description: 'Optional suffix for RC cuts (e.g. beta, nightly)'
        required: false
        type: string
        default: ''
      version:
        description: 'Explicit version override (must be strictly greater than latest stable)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  cut:
    runs-on: macos-15
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      should_release: ${{ steps.bump.outputs.should_release }}
      push_main: ${{ steps.bump.outputs.push_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compute next version
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KIND: ${{ inputs.kind }}
          VERSION: ${{ inputs.version }}
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: |
          set -euo pipefail
          NEXT_VERSION=$(node scripts/release/latest-stable-release.mjs)
          echo "Computed next version: v$NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Report dry run
        if: inputs.dry_run
        run: |
          echo "### Dry Run Release Cut" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target Ref:** \`${{ inputs.ref || 'main' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Kind:** \`${{ inputs.kind }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Computed Version:** \`${{ steps.compute.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${{ steps.compute.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Bump manifests & tag release commit
        id: bump
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.compute.outputs.version }}
          TAG: ${{ steps.compute.outputs.tag }}
          TARGET_REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bump Cargo.toml, apps/desktop/package.json, tauri.conf.json
          node scripts/release/bump-version.mjs "$VERSION"

          # Re-export Specta bindings for the new version if needed
          cargo test -p dive-desktop --lib export_bindings || true

          git add Cargo.toml apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json
          if [ -d apps/desktop/src/generated ]; then
            git add apps/desktop/src/generated || true
          fi

          git commit -m "release: $TAG"

          # Strict safety check: verify only version manifests were committed
          COMMITTED="$(git diff-tree --no-commit-id --name-only -r -m --first-parent HEAD | \
            grep -vxF -e 'Cargo.toml' -e 'apps/desktop/package.json' -e 'apps/desktop/src-tauri/tauri.conf.json' -e 'apps/desktop/src/generated/bindings.ts' || true)"
          if [ -n "$COMMITTED" ]; then
            echo "::error::Release commit carries unexpected paths: $COMMITTED" >&2
            exit 1
          fi

          git tag -a "$TAG" -m "Dive Browser $TAG"

          # Check if target ref matches main branch
          PUSH_MAIN="false"
          if [[ "$TARGET_REF" == "main" || "$TARGET_REF" == "refs/heads/main" ]]; then
            PUSH_MAIN="true"
            git push origin "HEAD:refs/heads/main"
          fi
          git push origin "$TAG"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "push_main=$PUSH_MAIN" >> "$GITHUB_OUTPUT"

  create-draft:
    needs: cut
    if: needs.cut.outputs.should_release == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.cut.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create draft release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/release/create-draft-release.mjs "${{ needs.cut.outputs.tag }}"

  preflight-gates:
    needs: cut
    if: needs.cut.outputs.should_release == 'true'
    runs-on: macos-15
    env:
      CARGO_TERM_COLOR: always
      CEF_PATH: ${{ github.workspace }}/.cef
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.cut.outputs.tag }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: brew install cmake ninja
      - name: Cache CEF binaries
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm --filter @dive/desktop exec vite build

  build-and-stage:
    needs: [cut, create-draft, preflight-gates]
    if: needs.cut.outputs.should_release == 'true'
    runs-on: macos-15
    env:
      CARGO_TERM_COLOR: always
      CEF_PATH: ${{ github.workspace }}/.cef
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.cut.outputs.tag }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install cmake ninja

      - name: Cache CEF binaries
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Build, sign, notarize macOS bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DIVE_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          pnpm --filter @dive/desktop exec tauri build \
            --config "{\"plugins\":{\"updater\":{\"pubkey\":\"$DIVE_UPDATER_PUBKEY\"}}}"
          scripts/release/prepare-bundle.sh target/release/bundle/macos/Dive.app

      - name: Prepare updater manifest and package artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          cp target/release/bundle/dmg/*.dmg out/ 2>/dev/null || true
          cp target/release/bundle/macos/*.tar.gz out/
          cp target/release/bundle/macos/*.tar.gz.sig out/

          VERSION="${{ needs.cut.outputs.version }}"
          SIG=$(cat out/*.tar.gz.sig)
          ARCHIVE=$(basename out/*.tar.gz)

          cat > out/latest.json <<JSON
          {
            "version": "${VERSION}",
            "notes": "Dive ${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${{ needs.cut.outputs.tag }}/${ARCHIVE}"
              }
            }
          }
          JSON
          ls -la out

      - name: Upload artifacts to GitHub draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.cut.outputs.tag }}" out/* --clobber --repo "${{ github.repository }}"

  publish:
    needs: [cut, build-and-stage]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.cut.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release required assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/release/verify-release-required-assets.mjs "${{ needs.cut.outputs.tag }}"

      - name: Publish complete draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/release/publish-complete-draft-releases.mjs "${{ needs.cut.outputs.tag }}"

      - name: Post release summary
        run: |
          echo "## Release Successfully Published 🎉" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${{ needs.cut.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release:** https://github.com/${{ github.repository }}/releases/tag/${{ needs.cut.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Update Manifest:** https://github.com/${{ github.repository }}/releases/download/${{ needs.cut.outputs.tag }}/latest.json" >> "$GITHUB_STEP_SUMMARY"
