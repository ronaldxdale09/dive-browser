name: release

# Two ways in, one path through:
#
#   - Run this workflow and pick a bump. The version is computed from the tags
#     that already exist and the tag is created *by the publish step*, so a run
#     that fails leaves no tag, no commit and no half-release behind.
#   - Push a `vX.Y.Z` tag yourself. The version is read from the ref.
#
# The version bump is committed to main by `finalize`, only after the release
# is published and verified. The repository never records a release that does
# not exist.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      kind:
        description: "Version bump (ignored when an exact version is given)"
        required: false
        type: choice
        options: [patch, minor, major, rc]
        default: patch
      version:
        description: "Exact version, e.g. 0.2.0 (overrides the bump)"
        required: false
        type: string

# Releases are serialized. Cancelling a publish half way through is how a tag
# ends up existing with no assets behind it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CEF_PATH: ${{ github.workspace }}/.cef
  # whisper.cpp must not probe the virtualised runner CPU; see the file.
  CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/scripts/ci/ggml-portable.cmake

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      name: ${{ steps.resolve.outputs.name }}
      is_prerelease: ${{ steps.resolve.outputs.isPrerelease }}
      make_latest: ${{ steps.resolve.outputs.makeLatest }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, so the next version is computed against all of them.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: resolve
        name: Resolve release version
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            node scripts/release/resolve-release.mjs --ref "${GITHUB_REF_NAME}" --github-output
          else
            node scripts/release/resolve-release.mjs \
              --kind "${{ inputs.kind }}" \
              ${{ inputs.version && format('--version {0}', inputs.version) || '' }} \
              --github-output
          fi

      # The heavy Rust gate runs in ci.yml on every push to main, so this is
      # the fast half: the parts that would make a release wrong rather than
      # merely broken, plus the release scripts' own tests.
      - name: Preflight checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

  build:
    name: Build macOS (aarch64)
    needs: preflight
    runs-on: macos-15
    # Longer than the Windows job because this one also waits on Apple's
    # notarization queue, which is not ours to hurry. 60 was enough only while
    # the caches were warm: a dependency change invalidates both the CEF
    # download and the Rust cache, and a cold build then runs past the cap and
    # is cancelled at the finish line.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install cmake ninja

      - name: Cache CEF binaries
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      # Stamped into this checkout only. Nothing is committed here; `finalize`
      # commits the bump once the release exists.
      - name: Stamp release version
        run: node scripts/release/stamp-versions.mjs "${{ needs.preflight.outputs.version }}"

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ephemeral-keychain' }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No Apple signing certificate configured; the build will not be notarized."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Build app and updater artifacts
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DIVE_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # An app built without the updater keypair cannot verify an update and
          # produces no signature to publish. Shipping that is the failure this
          # pipeline exists to prevent, so it is fatal rather than a warning.
          if [ -z "${DIVE_UPDATER_PUBKEY:-}" ] || [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::Updater signing keys are not configured." \
                 "Set TAURI_SIGNING_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY" \
                 "(see scripts/release/setup-signing-secrets.sh)."
            exit 1
          fi
          pnpm --filter @dive/desktop exec tauri build \
            --config "{\"plugins\":{\"updater\":{\"pubkey\":\"$DIVE_UPDATER_PUBKEY\"}}}"
          scripts/release/prepare-bundle.sh target/release/bundle/macos/Dive.app

      # Fails when the signature or the archive is missing, instead of writing
      # a manifest with an empty field that only breaks on a user's machine.
      - name: Build update manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          cp target/release/bundle/dmg/*.dmg out/
          cp target/release/bundle/macos/*.tar.gz out/
          cp target/release/bundle/macos/*.tar.gz.sig out/

          # Exactly one of each: more than one archive means the bundle step
          # produced something unexpected, and picking the first would decide
          # at random which build users receive.
          archives=(out/*.tar.gz)
          signatures=(out/*.tar.gz.sig)
          if [ "${#archives[@]}" -ne 1 ] || [ "${#signatures[@]}" -ne 1 ]; then
            echo "::error::Expected one updater archive and one signature," \
                 "found ${#archives[@]} and ${#signatures[@]}."
            exit 1
          fi

          node scripts/release/update-manifest.mjs build \
            --version "${{ needs.preflight.outputs.version }}" \
            --target aarch64-apple-darwin \
            --archive "${archives[0]}" \
            --signature-file "${signatures[0]}" \
            --notes "${{ needs.preflight.outputs.name }}" \
            --base-url "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.tag }}" \
            --out out/manifest-aarch64-apple-darwin.json

      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: out/*
          if-no-files-found: error

  build-windows:
    name: Build Windows (x86_64)
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      # CEF's dll wrapper is built with the static C++ runtime -- CEF's own
      # convention, not configurable from here -- and a program links exactly
      # one. whisper.cpp otherwise brings the dynamic one and the link ends in
      # dozens of duplicate std::locale symbols.
      #
      # Three things are needed, because the runtime flag can be set in three
      # places and the last one wins:
      #
      #   CFLAGS/CXXFLAGS  cc appends these after its own -MD, and MSVC
      #                    honours the last runtime flag it is given. This
      #                    covers CMAKE_<LANG>_FLAGS, which is built from cc's
      #                    compiler line.
      #   *_FLAGS_RELEASE  CMake appends the per-config flags after those, and
      #                    its MSVC default carries /MD -- which is what beat
      #                    the previous three attempts at this. whisper-rs-sys
      #                    forwards any CMAKE_* variable from the environment
      #                    as a define, and the cmake crate leaves the variable
      #                    alone once it is defined.
      #   RUNTIME_LIBRARY  the documented knob, kept for the generators that
      #                    honour it rather than the flags.
      #
      # Written with a leading dash rather than a slash. cl accepts either, but
      # a step that runs under bash hands these to a native program through
      # MSYS, which rewrites anything shaped like an absolute POSIX path: /MT
      # arrived as C:/Program Files/Git/MT and cl tried to compile it.
      - name: Match CEF's C++ runtime
        shell: pwsh
        run: |
          "CFLAGS=-MT" >> $env:GITHUB_ENV
          "CXXFLAGS=-MT" >> $env:GITHUB_ENV
          "CMAKE_C_FLAGS_RELEASE=-MT -O2 -Ob2 -DNDEBUG" >> $env:GITHUB_ENV
          "CMAKE_CXX_FLAGS_RELEASE=-MT -O2 -Ob2 -DNDEBUG" >> $env:GITHUB_ENV
          "CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" >> $env:GITHUB_ENV

      - name: Cache CEF binaries
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Stamp release version
        run: node scripts/release/stamp-versions.mjs "${{ needs.preflight.outputs.version }}"

      # NSIS, not WiX: WiX is the Tauri default on Windows and its candle step
      # is the one part of this that cannot run on an ARM machine, so the
      # bundle target is named rather than left to `all`.
      - name: Build app and updater artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DIVE_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DIVE_UPDATER_PUBKEY:-}" ] || [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::Updater signing keys are not configured." \
                 "Set TAURI_SIGNING_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY" \
                 "(see scripts/release/setup-signing-secrets.sh)."
            exit 1
          fi
          pnpm --filter @dive/desktop exec tauri build --bundles nsis \
            --config "{\"plugins\":{\"updater\":{\"pubkey\":\"$DIVE_UPDATER_PUBKEY\"}}}"

      - name: Build update manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          # The installer is both what a person downloads and what the updater
          # downloads: the bundler signs -setup.exe rather than producing a
          # separate archive beside it.
          cp target/release/bundle/nsis/*-setup.exe out/
          cp target/release/bundle/nsis/*-setup.exe.sig out/

          archives=(out/*-setup.exe)
          signatures=(out/*-setup.exe.sig)
          if [ "${#archives[@]}" -ne 1 ] || [ "${#signatures[@]}" -ne 1 ]; then
            echo "::error::Expected one updater archive and one signature," \
                 "found ${#archives[@]} and ${#signatures[@]}."
            exit 1
          fi

          node scripts/release/update-manifest.mjs build \
            --version "${{ needs.preflight.outputs.version }}" \
            --target x86_64-pc-windows-msvc \
            --archive "${archives[0]}" \
            --signature-file "${signatures[0]}" \
            --notes "${{ needs.preflight.outputs.name }}" \
            --base-url "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.preflight.outputs.tag }}" \
            --out out/manifest-x86_64-pc-windows-msvc.json

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: out/*
          if-no-files-found: error


  release:
    name: Publish release
    needs: [preflight, build, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: "{macos,windows}-*"
          merge-multiple: true
          path: assets

      # One fragment per built platform, merged into the single manifest the
      # updater reads. With one platform this is a completeness check; adding
      # an architecture makes it a real merge without changing the publish.
      - name: Merge update manifests
        run: |
          set -euo pipefail
          node scripts/release/update-manifest.mjs merge assets/manifest-*.json \
            --expect-platforms darwin-aarch64,windows-x86_64 \
            --out assets/latest.json
          rm -f assets/manifest-*.json

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # On a manual run this is what creates the tag, so the tag never
          # exists before the assets that justify it.
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.preflight.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            assets/latest.json
            assets/*.dmg
            assets/*.tar.gz
            assets/*.tar.gz.sig
            assets/*-setup.exe
            assets/*-setup.exe.sig
          fail_on_unmatched_files: true

      # Against the release as GitHub stored it: the only state users are
      # served from, and the only place a truncated upload shows up.
      - name: Verify published assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release/verify-release-assets.mjs "${{ needs.preflight.outputs.tag }}"

  finalize:
    name: Record the version on main
    needs: [preflight, release]
    if: ${{ !failure() && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: stamp
        run: node scripts/release/stamp-versions.mjs "${{ needs.preflight.outputs.version }}" --github-output

      - name: Commit the version bump
        if: steps.stamp.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json
          git commit -m "chore(release): ${{ needs.preflight.outputs.tag }}"
          git push origin HEAD:main

      - name: Summary
        run: |
          {
            echo "## ${{ needs.preflight.outputs.name }}"
            echo
            echo "- Tag: \`${{ needs.preflight.outputs.tag }}\`"
            echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.preflight.outputs.tag }}"
            echo "- Prerelease: \`${{ needs.preflight.outputs.is_prerelease }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
