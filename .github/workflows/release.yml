name: release

# Two ways in, one path through:
#
#   - Run this workflow and pick a bump. The version is computed from the tags
#     that already exist and the tag is created *by the publish step*, so a run
#     that fails leaves no tag, no commit and no half-release behind.
#   - Push a `vX.Y.Z` tag yourself. The version is read from the ref.
#
# The version bump is committed to main by `finalize`, only after the release
# is published and verified. The repository never records a release that does
# not exist.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      kind:
        description: "Version bump (ignored when an exact version is given)"
        required: false
        type: choice
        options: [patch, minor, major, rc]
        default: patch
      version:
        description: "Exact version, e.g. 0.2.0 (overrides the bump)"
        required: false
        type: string
      windows_only:
        description: "Build Windows assets for a locally signed macOS release; do not publish"
        required: false
        type: boolean
        default: false

# Releases are serialized. Cancelling a publish half way through is how a tag
# ends up existing with no assets behind it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CEF_PATH: ${{ github.workspace }}/.cef
  # whisper.cpp must not probe the virtualised runner CPU; see the file.
  CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/scripts/ci/ggml-portable.cmake

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      name: ${{ steps.resolve.outputs.name }}
      is_prerelease: ${{ steps.resolve.outputs.isPrerelease }}
      make_latest: ${{ steps.resolve.outputs.makeLatest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Every tag, so the next version is computed against all of them.
          fetch-depth: 0

      # ci.yml runs clippy, the Rust tests, cargo audit/deny and the live
      # end-to-end job; this workflow runs none of them. Releasing a commit
      # those never passed on is how a red main ships, so the run that passed
      # must exist for this exact commit before anything is built or signed.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq '.total_count')"
          if [ "${passed}" -lt 1 ]; then
            echo "::error::No successful ci.yml run for ${GITHUB_SHA}. Wait for CI to finish green on this commit, then run the release again."
            exit 1
          fi
          echo "ci.yml passed on ${GITHUB_SHA}"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: resolve
        name: Resolve release version
        env:
          KIND: ${{ inputs.kind }}
          EXACT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            node scripts/release/resolve-release.mjs --ref "${GITHUB_REF_NAME}" --github-output
          elif [ -n "${EXACT_VERSION}" ]; then
            node scripts/release/resolve-release.mjs --kind "${KIND}" --version "${EXACT_VERSION}" --github-output
          else
            node scripts/release/resolve-release.mjs --kind "${KIND}" --github-output
          fi

      # The heavy Rust gate runs in ci.yml on every push to main, so this is
      # the fast half: the parts that would make a release wrong rather than
      # merely broken, plus the release scripts' own tests.
      - name: Preflight checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      # CI audited this commit when it was pushed; an advisory published since
      # then would otherwise ship. Lockfile-only, so no build is needed.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.98.0
        with:
          toolchain: 1.98.0
      # Prebuilt binary; compiling cargo-audit from source took ~4 minutes.
      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Dependency advisories
        run: cargo audit

  build:
    name: Build macOS (aarch64)
    if: ${{ !inputs.windows_only }}
    needs: preflight
    runs-on: macos-15
    # Longer than the Windows job because this one also waits on Apple's
    # notarization queue, which is not ours to hurry. 60 was enough only while
    # the caches were warm: a dependency change invalidates both the CEF
    # download and the Rust cache, and a cold build then runs past the cap and
    # is cancelled at the finish line.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.98.0
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: brew install cmake ninja

      # .cef holds one directory per CEF version (cef-dll-sys downloads into
      # $CEF_PATH/<version>), so the cache is keyed on that version alone: an
      # unrelated Cargo.lock change must not throw away 468 MB of CEF.
      - name: CEF version
        id: cef
        shell: bash
        run: |
          v="$(grep -A1 '^name = "cef-dll-sys"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          [ -n "$v" ] || { echo "::error::cef-dll-sys not found in Cargo.lock"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache CEF binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}

      # Stamped into this checkout only. Nothing is committed here; `finalize`
      # commits the bump once the release exists.
      - name: Stamp release version
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release/stamp-versions.mjs "${RELEASE_VERSION}"

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ephemeral-keychain' }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No Apple signing certificate configured; the build will not be notarized."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # A new keychain locks itself again after five minutes. A cold
          # compile runs longer than that, and codesign then finds it locked
          # and waits for a password prompt no one can answer on a runner:
          # the v0.1.23 run sat in codesign for 1 h 48 min until the job
          # timed out. Six hours, and no locking on sleep.
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      # The updater key is not here. The bundle is built with updater
      # artifacts off, the archive is made below, and the sign-macos job signs
      # it. Nothing this step runs (the Vite toolchain, every build.rs) can
      # read the key that every installed copy of Dive trusts.
      - name: Build app and updater artifacts
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DIVE_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # An app built without the updater public key cannot verify an
          # update. Shipping that is the failure this pipeline exists to
          # prevent, so it is fatal rather than a warning. The private key is
          # checked in the sign job.
          if [ -z "${DIVE_UPDATER_PUBKEY:-}" ]; then
            echo "::error::Updater public key is not configured." \
                 "Set TAURI_SIGNING_PUBLIC_KEY" \
                 "(see scripts/release/setup-signing-secrets.sh)."
            exit 1
          fi
          pnpm --filter @dive/desktop exec tauri build \
            --config src-tauri/tauri.no-updater.conf.json \
            --config "{\"plugins\":{\"updater\":{\"pubkey\":\"$DIVE_UPDATER_PUBKEY\"}}}"
          # The overlay turns Tauri's own archive off; a leftover one would
          # mean the overlay was ignored.
          [ -d target/release/bundle/macos/Dive.app ] || { echo "::error::No Dive.app in target/release/bundle/macos."; exit 1; }
          [ ! -e target/release/bundle/macos/Dive.app.tar.gz ] || { echo "::error::Dive.app.tar.gz already exists; the no-updater overlay was ignored."; exit 1; }
          # Made the way Tauri makes it, from exactly what the build left,
          # before prepare-bundle.sh touches the app.
          ( cd target/release/bundle/macos && COPYFILE_DISABLE=1 tar --no-mac-metadata -czf Dive.app.tar.gz Dive.app )
          scripts/release/prepare-bundle.sh target/release/bundle/macos/Dive.app

      # The archive is hand-made, so prove it carries a valid app before it
      # is handed to the signing job and then to every installed copy.
      - name: Verify updater archive
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/check"
          mkdir -p "${RUNNER_TEMP}/check"
          tar -xzf target/release/bundle/macos/Dive.app.tar.gz -C "${RUNNER_TEMP}/check"
          codesign --verify --deep --strict --verbose=2 "${RUNNER_TEMP}/check/Dive.app"
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            spctl -a -vv "${RUNNER_TEMP}/check/Dive.app"
          else
            echo "No Apple signing certificate configured; skipping the Gatekeeper check."
          fi

      # Tauri writes the disk image with zlib; the same image packed with LZMA
      # is about a quarter smaller and nothing is removed. The script re-signs
      # the converted image with the same identity and proves it mounts before
      # it replaces the original. Only the DMG a person downloads shrinks: the
      # updater's .tar.gz must stay gzip, which is all the updater can read.
      - name: Recompress DMG with LZMA
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::Expected one DMG, found ${#dmgs[@]}."; exit 1; }
          scripts/release/compress-dmg.sh "${dmgs[0]}"

      - name: Stage unsigned outputs
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          cp target/release/bundle/dmg/*.dmg out/
          cp target/release/bundle/macos/Dive.app.tar.gz out/

          # Exactly one archive: picking the first of several would decide at
          # random which build users receive.
          archives=(out/*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected one updater archive, found ${#archives[@]}."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-macos-aarch64
          path: out/*
          if-no-files-found: error

      - name: Delete the build keychain
        if: always()
        run: security delete-keychain build.keychain || true

  build-windows:
    name: Build Windows (x86_64)
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.98.0
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # CEF's dll wrapper is built with the static C++ runtime -- CEF's own
      # convention, not configurable from here -- and a program links exactly
      # one. whisper.cpp otherwise brings the dynamic one and the link ends in
      # dozens of duplicate std::locale symbols.
      #
      # Three things are needed, because the runtime flag can be set in three
      # places and the last one wins:
      #
      #   CFLAGS/CXXFLAGS  cc appends these after its own -MD, and MSVC
      #                    honours the last runtime flag it is given. This
      #                    covers CMAKE_<LANG>_FLAGS, which is built from cc's
      #                    compiler line.
      #   *_FLAGS_RELEASE  CMake appends the per-config flags after those, and
      #                    its MSVC default carries /MD -- which is what beat
      #                    the previous three attempts at this. whisper-rs-sys
      #                    forwards any CMAKE_* variable from the environment
      #                    as a define, and the cmake crate leaves the variable
      #                    alone once it is defined.
      #   RUNTIME_LIBRARY  the documented knob, kept for the generators that
      #                    honour it rather than the flags.
      #
      # Written with a leading dash rather than a slash. cl accepts either, but
      # a step that runs under bash hands these to a native program through
      # MSYS, which rewrites anything shaped like an absolute POSIX path: /MT
      # arrived as C:/Program Files/Git/MT and cl tried to compile it.
      - name: Match CEF's C++ runtime
        shell: pwsh
        run: |
          "CFLAGS=-MT" >> $env:GITHUB_ENV
          "CXXFLAGS=-MT" >> $env:GITHUB_ENV
          "CMAKE_C_FLAGS_RELEASE=-MT -O2 -Ob2 -DNDEBUG" >> $env:GITHUB_ENV
          "CMAKE_CXX_FLAGS_RELEASE=-MT -O2 -Ob2 -DNDEBUG" >> $env:GITHUB_ENV
          "CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" >> $env:GITHUB_ENV

      # .cef holds one directory per CEF version (cef-dll-sys downloads into
      # $CEF_PATH/<version>), so the cache is keyed on that version alone: an
      # unrelated Cargo.lock change must not throw away 468 MB of CEF.
      - name: CEF version
        id: cef
        shell: bash
        run: |
          v="$(grep -A1 '^name = "cef-dll-sys"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          [ -n "$v" ] || { echo "::error::cef-dll-sys not found in Cargo.lock"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache CEF binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}

      - name: Stamp release version
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release/stamp-versions.mjs "${RELEASE_VERSION}"

      # NSIS, not WiX: WiX is the Tauri default on Windows and its candle step
      # is the one part of this that cannot run on an ARM machine, so the
      # bundle target is named rather than left to `all`.
      - name: Build app and updater artifacts
        shell: bash
        env:
          DIVE_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # The private key is not in this job. The sign-windows job signs the
          # installer this step produces.
          if [ -z "${DIVE_UPDATER_PUBKEY:-}" ]; then
            echo "::error::Updater public key is not configured." \
                 "Set TAURI_SIGNING_PUBLIC_KEY" \
                 "(see scripts/release/setup-signing-secrets.sh)."
            exit 1
          fi
          pnpm --filter @dive/desktop exec tauri build --bundles nsis \
            --config src-tauri/tauri.no-updater.conf.json \
            --config "{\"plugins\":{\"updater\":{\"pubkey\":\"$DIVE_UPDATER_PUBKEY\"}}}"

      - name: Stage unsigned outputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          # The installer is both what a person downloads and what the updater
          # downloads; the sign-windows job signs it in place of a separate
          # archive.
          cp target/release/bundle/nsis/*-setup.exe out/

          archives=(out/*-setup.exe)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected one installer, found ${#archives[@]}."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-x86_64
          path: out/*
          if-no-files-found: error


  sign-macos:
    name: Sign updater archive (macOS)
    needs: [preflight, build]
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            /scripts/release/
            /apps/desktop/package.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-macos-aarch64
          path: out

      # Only the signer, at the version the repo builds with, in a temp prefix:
      # no project dependency is installed next to the key.
      - name: Install the signer
        run: |
          set -euo pipefail
          v=$(node -p "require('./apps/desktop/package.json').devDependencies['@tauri-apps/cli-cef']")
          npm install --no-save --no-audit --no-fund --prefix "${RUNNER_TEMP}/signer" "@tauri-apps/cli-cef@$v"
          "${RUNNER_TEMP}/signer/node_modules/.bin/tauri" signer sign --help > /dev/null

      # The only step in this workflow with the updater key in its environment.
      - name: Sign updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::Updater signing keys are not configured." \
                 "Set TAURI_SIGNING_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY" \
                 "(see scripts/release/setup-signing-secrets.sh)."
            exit 1
          fi
          archives=(out/*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected one updater archive, found ${#archives[@]}."
            exit 1
          fi
          "${RUNNER_TEMP}/signer/node_modules/.bin/tauri" signer sign "${archives[0]}"
          signatures=(out/*.tar.gz.sig)
          if [ "${#signatures[@]}" -ne 1 ] || [ ! -s "${signatures[0]}" ]; then
            echo "::error::Expected one non-empty signature, found ${#signatures[@]}."
            exit 1
          fi

      # Fails when the signature or the archive is missing, instead of writing
      # a manifest with an empty field that only breaks on a user's machine.
      - name: Build update manifest
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_NAME: ${{ needs.preflight.outputs.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(out/*.tar.gz)
          signatures=(out/*.tar.gz.sig)
          if [ "${#archives[@]}" -ne 1 ] || [ "${#signatures[@]}" -ne 1 ]; then
            echo "::error::Expected one updater archive and one signature," \
                 "found ${#archives[@]} and ${#signatures[@]}."
            exit 1
          fi

          node scripts/release/update-manifest.mjs build \
            --version "${RELEASE_VERSION}" \
            --target aarch64-apple-darwin \
            --archive "${archives[0]}" \
            --signature-file "${signatures[0]}" \
            --notes "${RELEASE_NAME}" \
            --base-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --out out/manifest-aarch64-apple-darwin.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-aarch64
          path: out/*
          if-no-files-found: error

  sign-windows:
    name: Sign updater installer (Windows)
    needs: [preflight, build-windows]
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            /scripts/release/
            /apps/desktop/package.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-windows-x86_64
          path: out

      # Only the signer, at the version the repo builds with, in a temp prefix:
      # no project dependency is installed next to the key.
      - name: Install the signer
        run: |
          set -euo pipefail
          v=$(node -p "require('./apps/desktop/package.json').devDependencies['@tauri-apps/cli-cef']")
          npm install --no-save --no-audit --no-fund --prefix "${RUNNER_TEMP}/signer" "@tauri-apps/cli-cef@$v"
          "${RUNNER_TEMP}/signer/node_modules/.bin/tauri" signer sign --help > /dev/null

      # The only step in this workflow with the updater key in its environment.
      - name: Sign updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::Updater signing keys are not configured." \
                 "Set TAURI_SIGNING_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY" \
                 "(see scripts/release/setup-signing-secrets.sh)."
            exit 1
          fi
          archives=(out/*-setup.exe)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected one updater archive, found ${#archives[@]}."
            exit 1
          fi
          "${RUNNER_TEMP}/signer/node_modules/.bin/tauri" signer sign "${archives[0]}"
          signatures=(out/*-setup.exe.sig)
          if [ "${#signatures[@]}" -ne 1 ] || [ ! -s "${signatures[0]}" ]; then
            echo "::error::Expected one non-empty signature, found ${#signatures[@]}."
            exit 1
          fi

      # Fails when the signature or the archive is missing, instead of writing
      # a manifest with an empty field that only breaks on a user's machine.
      - name: Build update manifest
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_NAME: ${{ needs.preflight.outputs.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(out/*-setup.exe)
          signatures=(out/*-setup.exe.sig)
          if [ "${#archives[@]}" -ne 1 ] || [ "${#signatures[@]}" -ne 1 ]; then
            echo "::error::Expected one updater archive and one signature," \
                 "found ${#archives[@]} and ${#signatures[@]}."
            exit 1
          fi

          node scripts/release/update-manifest.mjs build \
            --version "${RELEASE_VERSION}" \
            --target x86_64-pc-windows-msvc \
            --archive "${archives[0]}" \
            --signature-file "${signatures[0]}" \
            --notes "${RELEASE_NAME}" \
            --base-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --out out/manifest-x86_64-pc-windows-msvc.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x86_64
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [preflight, sign-macos, sign-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "{macos,windows}-*"
          merge-multiple: true
          path: assets

      # One fragment per built platform, merged into the single manifest the
      # updater reads. With one platform this is a completeness check; adding
      # an architecture makes it a real merge without changing the publish.
      - name: Merge update manifests
        run: |
          set -euo pipefail
          node scripts/release/update-manifest.mjs merge assets/manifest-*.json \
            --expect-platforms darwin-aarch64,windows-x86_64 \
            --out assets/latest.json
          rm -f assets/manifest-*.json

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # On a manual run this is what creates the tag, so the tag never
          # exists before the assets that justify it.
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.preflight.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            assets/latest.json
            assets/*.dmg
            assets/*.tar.gz
            assets/*.tar.gz.sig
            assets/*-setup.exe
            assets/*-setup.exe.sig
          fail_on_unmatched_files: true

      # Against the release as GitHub stored it: the only state users are
      # served from, and the only place a truncated upload shows up.
      - name: Verify published assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: node scripts/release/verify-release-assets.mjs "${RELEASE_TAG}"

  finalize:
    name: Record the version on main
    needs: [preflight, release]
    if: ${{ !failure() && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - id: stamp
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/release/stamp-versions.mjs "${RELEASE_VERSION}" --github-output

      - name: Commit the version bump
        if: steps.stamp.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/cef/crash_reporter.cfg
          git commit -m "chore(release): ${RELEASE_TAG}"
          git push origin HEAD:main

      - name: Summary
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_NAME: ${{ needs.preflight.outputs.name }}
          RELEASE_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
        run: |
          {
            echo "## ${RELEASE_NAME}"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "- Prerelease: \`${RELEASE_PRERELEASE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
