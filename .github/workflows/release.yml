name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      kind:
        description: 'Release kind (rc, patch, minor, major)'
        required: true
        type: choice
        options:
          - rc
          - patch
          - minor
          - major
        default: rc
      dry_run:
        description: 'Dry run (validate without pushing tags or publishing release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CEF_PATH: ${{ github.workspace }}/.cef

jobs:
  build-and-release:
    name: Build & Release (macOS)
    runs-on: macos-15-xlarge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: brew install cmake ninja

      - name: Cache CEF binaries
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      # 1. If triggered by workflow_dispatch, cut and push the tag
      - name: Cut release tag
        if: github.event_name == 'workflow_dispatch'
        id: cut
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/release/release.mjs cut "${{ inputs.kind }}" --dry-run
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/release/release.mjs cut "${{ inputs.kind }}" --push
            VERSION=$(node scripts/release/release.mjs check "${{ inputs.kind }}")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      # 2. Determine active release tag and version
      - name: Set Release Metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ steps.cut.outputs.dry_run }}" = "true" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG="${{ steps.cut.outputs.tag }}"
            VERSION="${{ steps.cut.outputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # 3. Fast preflight check
      - name: Preflight verification
        if: steps.meta.outputs.skip != 'true'
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      # 4. Optional Apple Developer ID Certificate Import (if configured)
      - name: Import Apple signing certificate
        if: steps.meta.outputs.skip != 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ephemeral-keychain' }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No Apple signing certificate configured; skipping keychain import."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      # 5. Build Desktop Application Bundle
      - name: Build macOS application & updater bundle
        if: steps.meta.outputs.skip != 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DIVE_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${DIVE_UPDATER_PUBKEY:-}" ]; then
            pnpm --filter @dive/desktop exec tauri build \
              --config "{\"plugins\":{\"updater\":{\"pubkey\":\"$DIVE_UPDATER_PUBKEY\"}}}"
          else
            pnpm --filter @dive/desktop exec tauri build
          fi
          scripts/release/prepare-bundle.sh target/release/bundle/macos/Dive.app

      # 6. Package artifacts and updater manifest (latest.json)
      - name: Package release artifacts
        if: steps.meta.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p out
          cp target/release/bundle/dmg/*.dmg out/ 2>/dev/null || true
          cp target/release/bundle/macos/*.tar.gz out/ 2>/dev/null || true
          cp target/release/bundle/macos/*.tar.gz.sig out/ 2>/dev/null || true

          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SIG=""
          if compgen -G "out/*.tar.gz.sig" > /dev/null; then
            SIG=$(cat out/*.tar.gz.sig | head -n 1)
          fi
          ARCHIVE=""
          if compgen -G "out/*.tar.gz" > /dev/null; then
            ARCHIVE=$(basename $(ls out/*.tar.gz | head -n 1))
          fi

          cat > out/latest.json <<JSON
          {
            "version": "${VERSION}",
            "notes": "Dive ${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/${ARCHIVE}"
              }
            }
          }
          JSON
          ls -la out

      # 7. Publish GitHub Release
      - name: Publish to GitHub Releases
        if: steps.meta.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: out/*
          generate_release_notes: true
          prerelease: ${{ contains(steps.meta.outputs.tag, '-rc.') }}

      - name: Summary
        run: |
          echo "## Release Summary 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Event:** \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.meta.outputs.skip }}" = "true" ]; then
            echo "- **Result:** Dry run completed successfully (no releases created)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Tag:** \`${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release:** https://github.com/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          fi
