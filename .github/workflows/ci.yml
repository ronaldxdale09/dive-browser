name: ci

on:
  push:
    branches: [main, "autopilot/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CEF_PATH: ${{ github.workspace }}/.cef

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # cef-dll-sys builds libcef_dll_wrapper with CMake + Ninja.
      - run: brew install cmake ninja
        if: runner.os == 'macOS'

      - name: Cache CEF binaries
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Bindings are generated by the desktop crate's export test above.
      - run: git diff --exit-code -- apps/desktop/src/generated
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
