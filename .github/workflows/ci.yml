name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR makes the older run's result irrelevant. Runs on
# main are never cancelled: each commit there keeps its own result, which the
# release workflow checks for.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CEF_PATH: ${{ github.workspace }}/.cef
  # whisper.cpp must not probe the virtualised runner CPU; see the file.
  CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/scripts/ci/ggml-portable.cmake

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows compiles a different half of the codebase, and nothing else
        # in this pipeline reads it. Every Windows-only break so far has been
        # a compile error nobody saw until a build ran on a real machine.
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # The patched runtime is outside the workspace and builds into its
          # own target directory; without this it compiles from scratch.
          workspaces: |
            . -> target
            vendor/tauri-runtime-cef -> target

      # Prebuilt binaries: compiling these two from source cost 6.5 minutes of
      # every macOS run. Versions stay pinned. cargo-audit covers known CVEs;
      # cargo-deny covers the licenses we ship under and the sources we pull
      # from. See deny.toml.
      - name: Install Rust audit tools
        if: runner.os == 'macOS'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      # cef-dll-sys builds libcef_dll_wrapper with CMake + Ninja.
      - run: brew install cmake ninja
        if: runner.os == 'macOS'
      # windows-latest ships CMake; Ninja is not on the PATH by default.
      - name: Install Ninja
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      # CEF's dll wrapper is built with the static C++ runtime -- CEF's own
      # convention, not configurable from here -- and a program links exactly
      # one. whisper.cpp otherwise brings the dynamic one and the link ends in
      # dozens of duplicate std::locale symbols.
      #
      # Three things are needed, because the runtime flag can be set in three
      # places and the last one wins:
      #
      #   CFLAGS/CXXFLAGS  cc appends these after its own -MD, and MSVC
      #                    honours the last runtime flag it is given. This
      #                    covers CMAKE_<LANG>_FLAGS, which is built from cc's
      #                    compiler line.
      #   *_FLAGS_RELEASE  CMake appends the per-config flags after those, and
      #                    its MSVC default carries /MD -- which is what beat
      #                    the previous three attempts at this. whisper-rs-sys
      #                    forwards any CMAKE_* variable from the environment
      #                    as a define, and the cmake crate leaves the variable
      #                    alone once it is defined.
      #   RUNTIME_LIBRARY  the documented knob, kept for the generators that
      #                    honour it rather than the flags.
      #
      # Written with a leading dash rather than a slash. cl accepts either, but
      # a step that runs under bash hands these to a native program through
      # MSYS, which rewrites anything shaped like an absolute POSIX path: /MT
      # arrived as C:/Program Files/Git/MT and cl tried to compile it.
      - name: Match CEF's C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CFLAGS=-MT" >> $env:GITHUB_ENV
          "CXXFLAGS=-MT" >> $env:GITHUB_ENV
          "CMAKE_C_FLAGS_RELEASE=-MT -O2 -Ob2 -DNDEBUG" >> $env:GITHUB_ENV
          "CMAKE_CXX_FLAGS_RELEASE=-MT -O2 -Ob2 -DNDEBUG" >> $env:GITHUB_ENV
          "CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" >> $env:GITHUB_ENV

      # .cef holds one directory per CEF version (cef-dll-sys downloads into
      # $CEF_PATH/<version>), so the cache is keyed on that version alone: an
      # unrelated Cargo.lock change must not throw away 468 MB of CEF.
      - name: CEF version
        id: cef
        shell: bash
        run: |
          v="$(grep -A1 '^name = "cef-dll-sys"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          [ -n "$v" ] || { echo "::error::cef-dll-sys not found in Cargo.lock"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache CEF binaries
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}

      # The probes drive real processes through POSIX-shaped paths and
      # signals; they check the engine, not the platform port.
      - run: pnpm test:probes
        if: runner.os == 'macOS'
      - run: cargo fmt --all -- --check
      # Upstream tauri's style, so the vendored patch stays reviewable (plan 019).
      - run: cargo fmt --manifest-path vendor/tauri-runtime-cef/Cargo.toml -- --check
        if: runner.os == 'macOS'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The build without whisper.cpp is what Windows-on-ARM ships, and no
      # other job compiles it -- the cfg had drifted far enough that clippy
      # failed on it while every green run said otherwise.
      - name: Lint the build without the local transcription engine
        if: runner.os == 'macOS'
        run: cargo clippy -p dive-desktop --all-targets --no-default-features --features cef -- -D warnings
      - run: cargo test --workspace
      - name: Media export tests (need ffmpeg)
        if: runner.os == 'macOS'
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          # The import test wants an H.264 MP4 with audio; make a tiny one.
          fixture="$RUNNER_TEMP/dive-import-fixture.mp4"
          ffmpeg -v error -y -f lavfi -i color=c=blue:s=64x64:r=10:d=2 \
            -f lavfi -i sine=frequency=440:duration=2 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$fixture"
          DIVE_IMPORT_FIXTURE="$fixture" cargo test -p dive-desktop screen:: -- --ignored
      # The patched runtime is excluded from the workspace. Its native HWND
      # ownership tests must run on Windows, not just compile as a dependency.
      - name: Test the patched native runtime
        run: cargo test --manifest-path vendor/tauri-runtime-cef/Cargo.toml --lib --features native-test-manifest
      - run: cargo audit
        if: runner.os == 'macOS'
      - run: cargo deny check
        if: runner.os == 'macOS'

      # Bindings are generated by the desktop crate's export test above. They
      # are checked on one platform only: the command surface differs by cfg,
      # so a Windows run would legitimately produce a different file.
      - name: Bindings are in step with the commands
        if: runner.os == 'macOS'
        run: git diff --exit-code -- apps/desktop/src/generated
      # The chrome is platform-independent TypeScript; one OS is enough.
      - run: pnpm -r typecheck
        if: runner.os == 'macOS'
      - run: pnpm -r lint
        if: runner.os == 'macOS'
      - run: pnpm -r test
        if: runner.os == 'macOS'
      - run: pnpm --filter @dive/desktop exec vite build
        if: runner.os == 'macOS'
      - run: pnpm audit --prod --audit-level=moderate
        if: runner.os == 'macOS'

  live:
    # The real app, driven through its MCP server: open, read, screenshot,
    # discard and wake, renderer crash recovery, CDP latency, then the
    # 20-tab memory harness. Everything the unit tiers cannot see.
    # It builds its own bundle and needs nothing from `check`, so it runs
    # alongside it; the run as a whole is still red if either fails, which is
    # what the release gate reads.
    name: live (macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: brew install cmake ninja
      # .cef holds one directory per CEF version (cef-dll-sys downloads into
      # $CEF_PATH/<version>), so the cache is keyed on that version alone: an
      # unrelated Cargo.lock change must not throw away 468 MB of CEF.
      - name: CEF version
        id: cef
        shell: bash
        run: |
          v="$(grep -A1 '^name = "cef-dll-sys"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          [ -n "$v" ] || { echo "::error::cef-dll-sys not found in Cargo.lock"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache CEF binaries
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}
      - name: Build the debug app bundle
        run: pnpm --filter @dive/desktop exec tauri build --debug --bundles app --config src-tauri/tauri.no-updater.conf.json
      - name: Live end-to-end check
        # YouTube answers the runner's address with consent and bot pages, which
        # says nothing about Dive; the playback step stays a local check.
        env:
          DIVE_BIN: target/debug/bundle/macos/Dive.app/Contents/MacOS/dive-desktop
          LIVE_SKIP_YOUTUBE: "1"
          # A shared virtual machine stalls for tens of milliseconds at a time;
          # the 5 ms tail budget is for a real Mac (p50 on the runner is ~0.3 ms).
          CDP_P95_BUDGET_MS: "25"
        run: scripts/live-check.sh
      - name: Native window close and restart
        run: python3 scripts/native_lifecycle_check.py
        env:
          DIVE_BIN: target/debug/bundle/macos/Dive.app/Contents/MacOS/dive-desktop
      - name: Memory harness (discard must reclaim)
        run: scripts/benchmark-memory.sh
        env:
          DIVE_BIN: target/debug/bundle/macos/Dive.app/Contents/MacOS/dive-desktop
          STRESS_TABS: "12"
          STRESS_SETTLE_SECS: "20"
          MEM_MIN_RECLAIM_PCT: "30"
      - name: Startup benchmark
        run: scripts/benchmark-startup.sh
        env:
          DIVE_BIN: target/debug/bundle/macos/Dive.app/Contents/MacOS/dive-desktop
      # A native crash on the runner leaves its report here and nowhere else.
      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p target/crash-reports
          cp ~/Library/Logs/DiagnosticReports/dive-desktop*.ips target/crash-reports/ 2>/dev/null || true
          ls target/crash-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-logs
          path: |
            target/live-check.log
            target/crash-reports/
            target/memory-benchmark.json
            target/memory-probe-*/
            target/startup-benchmark-summary.json
            target/startup-probes-*/
            target/lifecycle-probes-*/
