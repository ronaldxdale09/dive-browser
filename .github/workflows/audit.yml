name: audit

# ci.yml audits on every push, but an advisory published on a quiet week
# otherwise surfaces only when someone next pushes -- or not at all before a
# release. This reads the lockfiles only, so it needs no CEF and no build.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      # Prebuilt binaries; compiling them from source cost 6.5 minutes.
      - name: Install audit tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - run: cargo audit
      - name: Vendored runtime lockfile
        run: cargo audit --file vendor/tauri-runtime-cef/Cargo.lock
      - run: cargo deny check advisories
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm audit --prod --audit-level=moderate
