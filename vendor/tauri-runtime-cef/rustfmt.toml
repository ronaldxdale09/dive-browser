# Upstream tauri's rustfmt.toml at the pinned revision (see UPSTREAM.md).
# Keeping upstream's style keeps `scripts/vendor-runtime-diff.sh` showing
# only Dive's real changes. Re-copy it when the pinned revision moves.
max_width = 100
hard_tabs = false
tab_spaces = 2
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
edition = "2024"
merge_derives = true
use_try_shorthand = false
use_field_init_shorthand = false
force_explicit_abi = true
