<!doctype html><html lang=en><head><meta charset=utf-8><title>form</title></head>
<body>

<h1>Sign in</h1>
<form id=form>
  <label>Email <input data-testid=email name=email type=email></label>
  <label>Password <input data-testid=password name=password type=password></label>
  <button type=submit>Sign in</button>
</form>
<div id=out></div>
<script>
  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.querySelector('[data-testid=email]').value;
    document.getElementById('out').innerHTML =
      '<p data-testid="welcome">Welcome, ' + email + '</p>';
  });
</script>

</body></html>
