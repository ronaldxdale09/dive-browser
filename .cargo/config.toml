# A Windows program links exactly one C runtime, and CEF decides which.
#
# `cef-dll-sys` builds `libcef_dll_wrapper` with the static runtime -- that is
# CEF's own convention and not configurable from here. Everything else native
# has to match, or the link ends in dozens of duplicate `std::locale` symbols
# and an `LNK2038` saying `MT_StaticRelease` does not match `MD_DynamicRelease`.
#
# Asking Rust for the static runtime is what makes the rest follow: the `cc`
# crate reads this target feature and emits `/MT` instead of `/MD`, and the
# `cmake` crate passes cc's flags on to whisper.cpp. Setting the CMake
# variable alone does not work -- an explicit `/MD` in the compiler flags beats
# `CMAKE_MSVC_RUNTIME_LIBRARY`, so the flag has to be right at the source.
#
# It lives here rather than in a workflow so a local Windows build and CI
# produce the same binary.
[target.'cfg(all(target_os = "windows", target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
