# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check
#
# `cargo audit` already fails the build on known CVEs. This adds the two things
# it does not check and that matter for a signed desktop binary we redistribute:
# what licenses we are shipping under, and where the code came from.

[advisories]
# Real vulnerabilities fail the build. Anything listed here must be an
# *unmaintained* notice for a transitive crate with no upgrade available, and
# must say which of our dependencies pulls it in, so the list can be re-checked
# on a dependency bump rather than accumulating forever.
ignore = [
    # gtk-rs GTK3 bindings, all unmaintained with no successor for GTK3.
    # Transitive via tauri's Linux backend; Dive ships macOS only today, so
    # none of this is in the shipped binary. Revisit when Linux is a target.
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2025-0057", # fxhash, transitive via selectors -> kuchikiki
    "RUSTSEC-2024-0436", # paste, transitive via specta
    "RUSTSEC-2024-0370", # proc-macro-error, transitive via glib
    # ttf-parser, transitive via ab_glyph -> sctk-adwaita -> winit (Linux
    # windowing again). `skrifa` is the successor but nothing upstream has
    # moved yet.
    "RUSTSEC-2026-0192",
    # Two *unsound* notices rather than unmaintained ones. Both were already
    # tolerated by `cargo audit`, which only fails on vulnerabilities; they are
    # written down here so a third one cannot arrive unnoticed.
    #
    # rand 0.7.3 is a build-dependency only (phf_codegen -> selectors), so it
    # runs in build scripts and never ships. The unsoundness additionally needs
    # a custom `log` logger that itself calls `rand::rng()`, which no build
    # script here does.
    "RUSTSEC-2026-0097",
    # glib 0.18, transitive via gtk/muda. Linux windowing again: not compiled
    # into the macOS binary Dive ships.
    "RUSTSEC-2024-0429",
]

[bans]
# Duplicate versions deep in the tauri/cef/reqwest trees are build-time bloat we
# mostly cannot fix, so surface them without failing the build.
multiple-versions = "warn"
wildcards = "allow"

[licenses]
# Permissive licenses only. A copyleft dependency reaching the shipped binary is
# a licensing problem for a distributed app, which is exactly the case
# `cargo audit` cannot see.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    # Public-domain dedication, used by whisper-rs and whisper-rs-sys, which
    # are how live subtitles run locally.
    "Unlicense",
    # The bzip2/libbzip2 license, a BSD-style permissive licence. Transitive
    # via download-cef, which unpacks the CEF archive at build time.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Dive builds on Tauri's CEF runtime, which lives on a branch rather than a
# release. The whole workspace is pinned to one revision through
# `[patch.crates-io]`; allowing the repository here means a *different* git
# dependency slipping in still fails the check.
allow-git = ["https://github.com/tauri-apps/tauri"]
